name: Test workflow dispatch type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          commands: deploy
          dispatch-type: workflow
      - name: Assert action ran with workflow dispatch type
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_MSG: ${{ steps.action.outputs.error-message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error-message: $ERROR_MSG"
          # Under act, eventName is workflow_dispatch, not issue_comment.
          # The action should either succeed (no-op) or fail gracefully.
          # With dispatch-type: workflow, validation errors may appear in error-message.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected for non-issue_comment event or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
