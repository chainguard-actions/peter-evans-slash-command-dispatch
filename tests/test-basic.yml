name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          commands: deploy,help
      - name: Assert action ran (exits gracefully on non-issue_comment event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_MSG: ${{ steps.action.outputs.error-message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error-message: $ERROR_MSG"
          # Under act, eventName is workflow_dispatch, not issue_comment.
          # The action should either succeed (no-op) or fail gracefully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully (no-op for non-issue_comment event)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected for non-issue_comment event or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
